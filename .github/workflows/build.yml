name: Build APK
on:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: stable
            org: com.example
            label: ملفاتي
          - flavor: beta
            org: com.malfati.beta
            label: ملفاتي تجريبي
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Write app files
        run: |
          mkdir -p lib
          cat > pubspec.yaml <<'PUBSPEC_EOF'
          name: file_organizer
          description: ينظم ملفات الموبايل تلقائياً حسب النوع
          publish_to: none
          version: 1.0.0

          environment:
            sdk: ">=3.3.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            google_fonts: ^6.2.1
            permission_handler: ^11.3.1
            path: ^1.9.0
            workmanager: any
            open_filex: any

          flutter:
            uses-material-design: true
          PUBSPEC_EOF
          cat > lib/main.dart <<'MAIN_EOF'
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:google_fonts/google_fonts.dart';
          import 'package:open_filex/open_filex.dart';
          import 'package:path/path.dart' as p;
          import 'package:permission_handler/permission_handler.dart';
          import 'package:workmanager/workmanager.dart';

          const root = '/storage/emulated/0';
          const outDir = '$root/Organized';
          const flavor = String.fromEnvironment('FLAVOR', defaultValue: 'stable');
          const sources = [
            '$root/DCIM',
            '$root/Pictures',
            '$root/Movies',
            '$root/Music',
            '$root/Documents',
            '$root/Download',
            '$root/Android/media/com.whatsapp/WhatsApp/Media',
            '$root/WhatsApp/Media',
            '$root/Telegram',
          ];

          enum Cat {
            images('صور', 'Images', Icons.photo_rounded, Color(0xFFFF6B9A), {'jpg', 'jpeg', 'png', 'webp', 'gif', 'heic', 'bmp'}),
            videos('فيديو', 'Videos', Icons.movie_rounded, Color(0xFFFF9F45), {'mp4', 'mkv', 'avi', 'mov', '3gp', 'webm'}),
            docs('مستندات', 'Documents', Icons.description_rounded, Color(0xFF4DA3FF), {'pdf', 'doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx', 'txt', 'csv'}),
            audio('صوتيات', 'Audio', Icons.music_note_rounded, Color(0xFF35D6A5), {'mp3', 'm4a', 'wav', 'aac', 'ogg', 'opus', 'flac'}),
            apps('تطبيقات', 'Apps', Icons.android_rounded, Color(0xFFA6E34B), {'apk', 'xapk'}),
            zips('مضغوطات', 'Archives', Icons.folder_zip_rounded, Color(0xFFB388FF), {'zip', 'rar', '7z', 'tar', 'gz'}),
            other('أخرى', 'Other', Icons.insert_drive_file_rounded, Color(0xFF8E9AAF), {});

            final String label, folder;
            final IconData icon;
            final Color color;
            final Set<String> exts;
            const Cat(this.label, this.folder, this.icon, this.color, this.exts);
          }

          Cat catOf(String path) {
            final e = p.extension(path).replaceFirst('.', '').toLowerCase();
            return Cat.values.firstWhere((c) => c.exts.contains(e), orElse: () => Cat.other);
          }

          Color shade(Color c, double d) {
            final h = HSLColor.fromColor(c);
            return h.withLightness((h.lightness + d).clamp(0.0, 1.0)).toColor();
          }

          bool hiddenPath(String path) => p.split(path).any((s) => s.startsWith('.'));

          bool shouldSkip(File f) {
            final n = p.basename(f.path).toLowerCase();
            if (hiddenPath(f.path)) return true;
            const partial = {'crdownload', 'part', 'tmp', 'temp', 'download'};
            if (partial.contains(p.extension(n).replaceFirst('.', ''))) return true;
            try {
              // ملف اتعدل من أقل من دقيقتين ممكن لسه بيتحمل، نسيبه
              if (DateTime.now().difference(f.lastModifiedSync()).inMinutes < 2) return true;
            } catch (_) {
              return true;
            }
            return false;
          }

          // سجل النسخ: كل سطر = مسار الأصل ، الحجم ، تاريخ التعديل ، مسار النسخة
          File get indexFile => File('$outDir/.index.tsv');

          String keyOf(File f, FileStat st) => '${f.path}\t${st.size}\t${st.modified.millisecondsSinceEpoch}';

          Set<String> loadIndex(int part, {bool keyOnly = false}) {
            final out = <String>{};
            if (!indexFile.existsSync()) return out;
            for (final l in indexFile.readAsLinesSync()) {
              final parts = l.split('\t');
              if (parts.length < 4) continue;
              out.add(keyOnly ? '${parts[0]}\t${parts[1]}\t${parts[2]}' : parts[part]);
            }
            return out;
          }

          void flushIndex(List<String> lines) {
            if (lines.isEmpty) return;
            Directory(outDir).createSync(recursive: true);
            indexFile.writeAsStringSync('${lines.join('\n')}\n', mode: FileMode.append);
          }

          void removeFromIndex(Set<String> dests) {
            if (!indexFile.existsSync()) return;
            final keep = indexFile.readAsLinesSync().where((l) {
              final parts = l.split('\t');
              return parts.length < 4 || !dests.contains(parts[3]);
            }).toList();
            indexFile.writeAsStringSync(keep.isEmpty ? '' : '${keep.join('\n')}\n');
          }

          Future<List<File>> collectFiles({bool onlyNew = true}) async {
            final files = <File>[];
            try {
              for (final e in Directory(root).listSync()) {
                if (e is File) files.add(e);
              }
            } catch (_) {}
            for (final s in sources) {
              final d = Directory(s);
              if (!d.existsSync()) continue;
              try {
                await for (final e in d.list(recursive: true, followLinks: false).handleError((_) {})) {
                  if (e is File) files.add(e);
                }
              } catch (_) {}
            }
            final keys = onlyNew ? loadIndex(0, keyOnly: true) : <String>{};
            return files.where((f) {
              if (shouldSkip(f)) return false;
              if (!onlyNew) return true;
              try {
                return !keys.contains(keyOf(f, f.statSync()));
              } catch (_) {
                return false;
              }
            }).toList();
          }

          /// بينسخ الملفات الجديدة بس إلى مجلد Organized، والأصل بيفضل مكانه
          Future<List<List<String>>> copyAll({void Function(int done, int total)? onProgress}) async {
            final files = await collectFiles();
            final made = <List<String>>[];
            final lines = <String>[];
            var done = 0;
            for (final f in files) {
              try {
                final st = f.statSync();
                final dir = Directory('$outDir/${catOf(f.path).folder}')..createSync(recursive: true);
                var dest = p.join(dir.path, p.basename(f.path));
                var i = 1;
                while (File(dest).existsSync()) {
                  dest = p.join(dir.path, '${p.basenameWithoutExtension(f.path)} ($i)${p.extension(f.path)}');
                  i++;
                }
                await f.copy(dest);
                try {
                  File(dest).setLastModifiedSync(st.modified);
                } catch (_) {}
                lines.add('${keyOf(f, st)}\t$dest');
                made.add([f.path, dest]);
              } catch (_) {}
              done++;
              if (onProgress != null && done % 20 == 0) onProgress(done, files.length);
              if (lines.length >= 100) {
                flushIndex(lines);
                lines.clear();
              }
            }
            flushIndex(lines);
            if (onProgress != null) onProgress(files.length, files.length);
            return made;
          }

          String restoreDir(Cat c) {
            switch (c) {
              case Cat.images:
                return '$root/Pictures/Restored';
              case Cat.videos:
                return '$root/Movies/Restored';
              case Cat.audio:
                return '$root/Music/Restored';
              case Cat.docs:
                return '$root/Documents/Restored';
              default:
                return '$root/Download/Restored';
            }
          }

          /// بيرجّع الملفات اللي اتنقلت (مش نسخ) من Organized لأماكن تانية يظهروا فيها للنظام
          Future<int> restoreAll() async {
            final copies = loadIndex(3);
            var n = 0;
            for (final c in Cat.values) {
              final d = Directory('$outDir/${c.folder}');
              if (!d.existsSync()) continue;
              final target = Directory(restoreDir(c))..createSync(recursive: true);
              for (final e in d.listSync()) {
                if (e is File && !copies.contains(e.path)) {
                  var dest = p.join(target.path, p.basename(e.path));
                  var i = 1;
                  while (File(dest).existsSync()) {
                    dest = p.join(target.path, '${p.basenameWithoutExtension(e.path)} ($i)${p.extension(e.path)}');
                    i++;
                  }
                  try {
                    try {
                      e.renameSync(dest);
                    } on FileSystemException {
                      e.copySync(dest);
                      e.deleteSync();
                    }
                    n++;
                  } catch (_) {}
                  if (n % 50 == 0) await Future<void>.delayed(Duration.zero);
                }
              }
            }
            return n;
          }

          /// بيشتغل في الخلفية كل 15 دقيقة حتى والتطبيق مقفول
          @pragma('vm:entry-point')
          void callbackDispatcher() {
            Workmanager().executeTask((task, input) async {
              try {
                if (await Permission.manageExternalStorage.isGranted) await copyAll();
              } catch (_) {}
              return true;
            });
          }

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await Workmanager().initialize(callbackDispatcher);
            runApp(const App());
          }

          class App extends StatelessWidget {
            const App({super.key});
            @override
            Widget build(BuildContext context) => MaterialApp(
                  debugShowCheckedModeBanner: false,
                  theme: ThemeData(
                    brightness: Brightness.dark,
                    textTheme: GoogleFonts.cairoTextTheme(ThemeData.dark().textTheme),
                  ),
                  builder: (c, child) => Directionality(textDirection: TextDirection.rtl, child: child!),
                  home: const Home(),
                );
          }

          /// قطعة مجسمة: وجه متدرج + حافة سفلية سميكة، وتنضغط لتحت وتميل عند اللمس.
          class Block3D extends StatefulWidget {
            final Color color;
            final double depth, radius;
            final VoidCallback? onTap;
            final Widget child;
            const Block3D({super.key, required this.color, required this.child, this.depth = 8, this.radius = 24, this.onTap});
            @override
            State<Block3D> createState() => _Block3DState();
          }

          class _Block3DState extends State<Block3D> {
            bool down = false;
            @override
            Widget build(BuildContext context) {
              final r = BorderRadius.circular(widget.radius);
              return GestureDetector(
                behavior: HitTestBehavior.opaque,
                onTapDown: (_) => setState(() => down = true),
                onTapCancel: () => setState(() => down = false),
                onTapUp: (_) => setState(() => down = false),
                onTap: widget.onTap,
                child: AnimatedContainer(
                  duration: const Duration(milliseconds: 110),
                  transformAlignment: Alignment.center,
                  transform: Matrix4.identity()
                    ..setEntry(3, 2, 0.0012)
                    ..rotateX(down ? 0.14 : 0.0),
                  padding: EdgeInsets.only(bottom: down ? 2 : widget.depth),
                  decoration: BoxDecoration(
                    color: shade(widget.color, -0.22),
                    borderRadius: r,
                    boxShadow: [BoxShadow(color: Colors.black.withAlpha(down ? 60 : 110), offset: Offset(0, down ? 3 : widget.depth + 6), blurRadius: down ? 8 : 20)],
                  ),
                  child: Container(
                    decoration: BoxDecoration(
                      borderRadius: r,
                      gradient: LinearGradient(begin: Alignment.topLeft, end: Alignment.bottomRight, colors: [shade(widget.color, 0.12), widget.color]),
                      border: Border.all(color: Colors.white.withAlpha(45), width: 1),
                    ),
                    child: widget.child,
                  ),
                ),
              );
            }
          }

          class Home extends StatefulWidget {
            const Home({super.key});
            @override
            State<Home> createState() => _HomeState();
          }

          class _HomeState extends State<Home> {
            final counts = {for (final c in Cat.values) c: 0};
            int pending = 0;
            bool busy = false;
            bool auto = false;
            String progress = '';
            List<List<String>> lastMoves = [];

            @override
            void initState() {
              super.initState();
              ensurePermission().then((_) => refresh());
              loadAuto();
            }

            Future<void> loadAuto() async {
              final granted = await Permission.manageExternalStorage.isGranted;
              final v = granted && File('$outDir/.auto_enabled').existsSync();
              if (mounted) setState(() => auto = v);
              if (v) organize();
            }

            Future<void> setAuto(bool v) async {
              try {
                if (v && !await ensurePermission()) {
                  toast('لازم توافق على صلاحية الوصول لكل الملفات');
                  return;
                }
                final flag = File('$outDir/.auto_enabled');
                if (v) {
                  flag.createSync(recursive: true);
                } else if (flag.existsSync()) {
                  flag.deleteSync();
                }
                if (mounted) setState(() => auto = v);
                try {
                  if (v) {
                    await Workmanager().registerPeriodicTask('auto-organize', 'autoOrganize', frequency: const Duration(minutes: 15));
                  } else {
                    await Workmanager().cancelByUniqueName('auto-organize');
                  }
                } catch (e) {
                  toast('الترتيب في الخلفية مش متاح: $e');
                }
                if (v) organize();
              } catch (e) {
                toast('خطأ: $e');
              }
            }

            Future<void> openCat(Cat c) async {
              try {
                await Navigator.of(context).push(MaterialPageRoute(builder: (_) => CategoryPage(c)));
              } catch (e) {
                toast('تعذر فتح القسم: $e');
              }
              refresh();
            }

            Future<bool> ensurePermission() async {
              final s = Permission.manageExternalStorage;
              return await s.isGranted || (await s.request()).isGranted;
            }

            Future<void> refresh() async {
              if (!await Permission.manageExternalStorage.isGranted) return;
              final files = await collectFiles();
              final m = <Cat, int>{};
              for (final c in Cat.values) {
                final d = Directory('$outDir/${c.folder}');
                m[c] = d.existsSync() ? d.listSync().whereType<File>().length : 0;
              }
              if (mounted) {
                setState(() {
                  pending = files.length;
                  counts.addAll(m);
                });
              }
            }

            Future<void> organize() async {
              if (busy) return;
              if (!await ensurePermission()) {
                toast('محتاج صلاحية الوصول لكل الملفات عشان أنسخها');
                return;
              }
              setState(() {
                busy = true;
                progress = '';
              });
              final made = await copyAll(onProgress: (d, t) {
                if (mounted) setState(() => progress = '$d / $t');
              });
              lastMoves = made;
              await refresh();
              if (mounted) setState(() => busy = false);
              toast('اتنسخ ${made.length} ملف، والأصل لسه مكانه');
            }

            Future<void> restore() async {
              if (busy) return;
              if (!await ensurePermission()) {
                toast('محتاج صلاحية الوصول لكل الملفات');
                return;
              }
              final ok = await showDialog<bool>(
                context: context,
                builder: (dc) => AlertDialog(
                  title: const Text('استرجاع الملفات'),
                  content: const Text(
                      'هرجّع الملفات اللي اتنقلت قبل كده من مجلد Organized:\nالصور في Pictures/Restored\nالفيديو في Movies/Restored\nالصوتيات في Music/Restored\nالمستندات في Documents/Restored\nوالباقي في Download/Restored\n\nالنسخ الجديدة اللي الأصل بتاعها موجود مش هتتلمس.'),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(dc, false), child: const Text('إلغاء')),
                    TextButton(onPressed: () => Navigator.pop(dc, true), child: const Text('رجّع')),
                  ],
                ),
              );
              if (ok != true) return;
              setState(() {
                busy = true;
                progress = '';
              });
              final n = await restoreAll();
              await refresh();
              if (mounted) setState(() => busy = false);
              toast('اتسترجع $n ملف');
            }

            Future<void> undo() async {
              setState(() => busy = true);
              final dests = <String>{};
              for (final m in lastMoves) {
                try {
                  File(m[1]).deleteSync();
                  dests.add(m[1]);
                } catch (_) {}
              }
              removeFromIndex(dests);
              final n = dests.length;
              lastMoves = [];
              await refresh();
              if (mounted) setState(() => busy = false);
              toast('اتمسح $n نسخة من آخر عملية');
            }

            void toast(String t) => ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(t)));

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Container(
                  decoration: const BoxDecoration(
                    gradient: LinearGradient(begin: Alignment.topCenter, end: Alignment.bottomCenter, colors: [Color(0xFF1B1840), Color(0xFF0E0C24)]),
                  ),
                  child: SafeArea(
                    child: Padding(
                      padding: const EdgeInsets.fromLTRB(20, 20, 20, 8),
                      child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                        const Text('ملفاتي', style: TextStyle(fontSize: 34, fontWeight: FontWeight.w800)),
                        Text('في $pending ملف مستني النسخ  •  v6${flavor == "beta" ? "  •  تجريبي" : ""}',
                            style: TextStyle(fontSize: 15, color: Colors.white.withAlpha(150))),
                        const SizedBox(height: 16),
                        Block3D(
                          color: const Color(0xFF7C5CFF),
                          depth: 10,
                          radius: 28,
                          onTap: busy ? null : organize,
                          child: Padding(
                            padding: const EdgeInsets.symmetric(vertical: 20),
                            child: Center(
                              child: busy
                                  ? Row(mainAxisSize: MainAxisSize.min, children: [
                                      const SizedBox(width: 26, height: 26, child: CircularProgressIndicator(strokeWidth: 3, color: Colors.white)),
                                      const SizedBox(width: 12),
                                      Text(progress.isEmpty ? 'جاري الشغل...' : 'جاري النسخ $progress', style: const TextStyle(fontSize: 17, fontWeight: FontWeight.w800)),
                                    ])
                                  : const Row(mainAxisSize: MainAxisSize.min, children: [
                                      Icon(Icons.auto_awesome_rounded, size: 26),
                                      SizedBox(width: 10),
                                      Text('انسخ ورتّب ملفاتي', style: TextStyle(fontSize: 20, fontWeight: FontWeight.w800)),
                                    ]),
                            ),
                          ),
                        ),
                        const SizedBox(height: 20),
                        Block3D(
                          color: const Color(0xFFFF9F45),
                          depth: 5,
                          radius: 20,
                          onTap: busy ? null : restore,
                          child: const Padding(
                            padding: EdgeInsets.symmetric(vertical: 12),
                            child: Center(
                              child: Row(mainAxisSize: MainAxisSize.min, children: [
                                Icon(Icons.restore_rounded, size: 22),
                                SizedBox(width: 8),
                                Text('استرجاع الملفات اللي اتنقلت', style: TextStyle(fontSize: 15, fontWeight: FontWeight.w800)),
                              ]),
                            ),
                          ),
                        ),
                        const SizedBox(height: 14),
                        Container(
                          padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 2),
                          decoration: BoxDecoration(color: Colors.white.withAlpha(20), borderRadius: BorderRadius.circular(20), border: Border.all(color: Colors.white.withAlpha(30))),
                          child: SwitchListTile(
                            contentPadding: EdgeInsets.zero,
                            value: auto,
                            onChanged: busy ? null : setAuto,
                            activeColor: const Color(0xFF35D6A5),
                            title: const Text('نسخ تلقائي', style: TextStyle(fontWeight: FontWeight.w800)),
                            subtitle: Text('ينسخ الملفات الجديدة لوحده كل 15 دقيقة', style: TextStyle(fontSize: 12, color: Colors.white.withAlpha(150))),
                          ),
                        ),
                        const SizedBox(height: 16),
                        Expanded(
                          child: GridView.count(
                            crossAxisCount: 2,
                            mainAxisSpacing: 18,
                            crossAxisSpacing: 18,
                            childAspectRatio: 1.08,
                            children: [
                              for (final c in Cat.values)
                                Block3D(
                                  color: c.color,
                                  depth: 7,
                                  onTap: () => openCat(c),
                                  child: Padding(
                                    padding: const EdgeInsets.all(14),
                                    child: Column(mainAxisAlignment: MainAxisAlignment.spaceBetween, crossAxisAlignment: CrossAxisAlignment.start, children: [
                                      Container(
                                        padding: const EdgeInsets.all(8),
                                        decoration: BoxDecoration(color: Colors.white.withAlpha(50), shape: BoxShape.circle),
                                        child: Icon(c.icon, size: 26),
                                      ),
                                      Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                                        Text(c.label, style: const TextStyle(fontSize: 17, fontWeight: FontWeight.w800)),
                                        Text('${counts[c]} ملف', style: TextStyle(fontSize: 13, color: Colors.white.withAlpha(200))),
                                      ]),
                                    ]),
                                  ),
                                ),
                            ],
                          ),
                        ),
                        if (lastMoves.isNotEmpty && !busy)
                          Center(child: TextButton.icon(onPressed: undo, icon: const Icon(Icons.undo_rounded), label: const Text('تراجع: امسح نسخ آخر عملية'))),
                      ]),
                    ),
                  ),
                ),
              );
            }
          }

          String fmtSize(int b) {
            if (b < 1024) return '$b B';
            if (b < 1048576) return '${(b / 1024).toStringAsFixed(0)} KB';
            if (b < 1073741824) return '${(b / 1048576).toStringAsFixed(1)} MB';
            return '${(b / 1073741824).toStringAsFixed(2)} GB';
          }

          /// شاشة قسم: بتعرض ملفات القسم وتفتح أي ملف بلمسة
          class CategoryPage extends StatefulWidget {
            final Cat cat;
            const CategoryPage(this.cat, {super.key});
            @override
            State<CategoryPage> createState() => _CategoryPageState();
          }

          class _CategoryPageState extends State<CategoryPage> {
            List<MapEntry<File, FileStat>>? items;

            @override
            void initState() {
              super.initState();
              load();
            }

            Future<void> load() async {
              final d = Directory('$outDir/${widget.cat.folder}');
              final list = <MapEntry<File, FileStat>>[];
              if (d.existsSync()) {
                await for (final e in d.list(followLinks: false)) {
                  if (e is File) list.add(MapEntry(e, e.statSync()));
                }
              }
              list.sort((a, b) => b.value.modified.compareTo(a.value.modified));
              if (mounted) setState(() => items = list);
            }

            Future<void> openFile(File f) async {
              final r = await OpenFilex.open(f.path);
              if (r.type != ResultType.done && mounted) {
                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('مفيش تطبيق على الموبايل يفتح الملف ده')));
              }
            }

            @override
            Widget build(BuildContext context) {
              final c = widget.cat;
              final list = items;
              return Scaffold(
                body: Container(
                  decoration: const BoxDecoration(
                    gradient: LinearGradient(begin: Alignment.topCenter, end: Alignment.bottomCenter, colors: [Color(0xFF1B1840), Color(0xFF0E0C24)]),
                  ),
                  child: SafeArea(
                    child: Column(children: [
                      Padding(
                        padding: const EdgeInsets.fromLTRB(8, 8, 20, 8),
                        child: Row(children: [
                          IconButton(icon: const Icon(Icons.arrow_forward_rounded), onPressed: () => Navigator.pop(context)),
                          Icon(c.icon, color: c.color),
                          const SizedBox(width: 10),
                          Text(c.label, style: const TextStyle(fontSize: 24, fontWeight: FontWeight.w800)),
                          const Spacer(),
                          Text('${list?.length ?? 0} ملف', style: TextStyle(color: Colors.white.withAlpha(150))),
                        ]),
                      ),
                      Expanded(
                        child: list == null
                            ? const Center(child: CircularProgressIndicator())
                            : list.isEmpty
                                ? Center(child: Text('مفيش ملفات هنا لسه', style: TextStyle(color: Colors.white.withAlpha(150))))
                                : c == Cat.images
                                    ? GridView.builder(
                                        padding: const EdgeInsets.all(12),
                                        gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(crossAxisCount: 3, mainAxisSpacing: 8, crossAxisSpacing: 8),
                                        itemCount: list.length,
                                        itemBuilder: (_, i) => GestureDetector(
                                          onTap: () => openFile(list[i].key),
                                          child: ClipRRect(
                                            borderRadius: BorderRadius.circular(14),
                                            child: Image.file(list[i].key, fit: BoxFit.cover, cacheWidth: 300, errorBuilder: (_, __, ___) => Container(color: c.color.withAlpha(60), child: const Icon(Icons.broken_image_rounded))),
                                          ),
                                        ),
                                      )
                                    : ListView.builder(
                                        padding: const EdgeInsets.fromLTRB(16, 4, 16, 20),
                                        itemCount: list.length,
                                        itemBuilder: (_, i) {
                                          final f = list[i].key;
                                          final st = list[i].value;
                                          return Padding(
                                            padding: const EdgeInsets.only(bottom: 14),
                                            child: Block3D(
                                              color: c.color,
                                              depth: 4,
                                              radius: 18,
                                              onTap: () => openFile(f),
                                              child: Padding(
                                                padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 12),
                                                child: Row(children: [
                                                  Icon(c.icon, size: 26),
                                                  const SizedBox(width: 12),
                                                  Expanded(
                                                    child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                                                      Text(p.basename(f.path), maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(fontWeight: FontWeight.w800)),
                                                      Text('${fmtSize(st.size)}  •  ${st.modified.year}/${st.modified.month}/${st.modified.day}', style: TextStyle(fontSize: 12, color: Colors.white.withAlpha(210))),
                                                    ]),
                                                  ),
                                                ]),
                                              ),
                                            ),
                                          );
                                        },
                                      ),
                      ),
                    ]),
                  ),
                ),
              );
            }
          }
          MAIN_EOF
      - name: Create Android project
        run: flutter create --platforms=android --org ${{ matrix.org }} --project-name file_organizer .
      - name: Add permissions and app name
        run: |
          sed -i '/<manifest/a <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/><uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/><uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>' android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="file_organizer"|android:label="${{ matrix.label }}"|' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release --no-shrink --dart-define=FLAVOR=${{ matrix.flavor }}
      - uses: actions/upload-artifact@v4
        with:
          name: file-organizer-v6-${{ matrix.flavor }}-apk
          path: build/app/outputs/flutter-apk/app-release.apk
